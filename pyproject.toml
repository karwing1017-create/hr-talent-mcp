[project]
name = "hr-talent-mcp"
version = "2.0.0"
description = "HR 人才盘点 MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.0.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
]

[project.scripts]
hr-talent-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["config.py", "db.py", "metrics.py", "server.py", "auth.py"]
